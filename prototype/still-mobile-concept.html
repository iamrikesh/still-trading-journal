<div id="still-concept" aria-label="Still mobile app design">
  <style>
    #still-concept{--st-bg:light-dark(#f6f4ee,#161a18);--st-panel:light-dark(#eeede6,#202622);--st-text:light-dark(#242e27,#eeeFE7);--st-muted:light-dark(#616b60,#a6b1a5);--st-line:light-dark(#d9ddd3,#343d35);--st-accent:light-dark(#344d32,#d2e4af);--st-on-accent:light-dark(#f8f8f0,#253222);--st-soft:light-dark(#e2e8d8,#2b372a);font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--st-text);width:100%;padding:12px 0;box-sizing:border-box}
    #still-concept *{box-sizing:border-box}#still-concept button,#still-concept textarea{font:inherit}#still-concept button{cursor:pointer;color:inherit}#still-concept button:disabled{cursor:default;opacity:.55}#still-concept [hidden]{display:none!important}
    #still-concept .st-phone{max-width:410px;margin:auto;background:var(--st-bg);border:1px solid var(--st-line);border-radius:32px;overflow:hidden;box-shadow:0 18px 50px #00000012}
    #still-concept .st-top{padding:24px 25px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}#still-concept .st-brand{font-family:Georgia,serif;font-size:29px;letter-spacing:-1.4px}#still-concept .st-demo{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--st-muted)}
    #still-concept .st-content{padding:12px 25px 28px;min-height:592px}#still-concept p,#still-concept h2,#still-concept h3{margin:0}#still-concept .st-meta{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--st-muted);display:flex;align-items:center;gap:8px}#still-concept .st-dot{width:6px;height:6px;border-radius:50%;background:var(--st-accent);display:inline-block}
    #still-concept h2{font-weight:400;font-size:37px;letter-spacing:-1.5px;line-height:1.16;margin:22px 0 12px}#still-concept h2 em{font-family:Georgia,serif;font-weight:400;color:var(--st-accent)}#still-concept .st-sub{font-size:13px;color:var(--st-muted);line-height:1.6}
    #still-concept .st-section{margin:29px 0 12px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--st-muted)}#still-concept .st-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}#still-concept .st-emotion{border:1px solid var(--st-line);border-radius:16px;background:var(--st-panel);padding:15px;text-align:left;min-height:95px;display:flex;flex-direction:column;gap:8px}#still-concept .st-emotion:hover{border-color:var(--st-accent)}#still-concept .st-emotion svg{width:18px;height:18px;color:var(--st-muted)}#still-concept .st-emotion span{font-size:14px}#still-concept .st-emotion small{font-size:11px;color:var(--st-muted)}
    #still-concept .st-quiet{background:none;border:0;font-size:12px;color:var(--st-muted);min-height:44px;padding:10px 0;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}#still-concept .st-primary{width:100%;border:0;border-radius:16px;padding:16px;background:var(--st-accent);color:var(--st-on-accent);font-size:14px;display:flex;align-items:center;justify-content:center;gap:9px;min-height:52px}#still-concept .st-primary svg,#still-concept .st-quiet svg{width:18px;height:18px}#still-concept .st-nav{border-top:1px solid var(--st-line);padding:12px 20px 17px;display:flex;gap:10px}#still-concept .st-nav button{flex:1;border:0;border-radius:12px;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--st-muted);padding:9px 5px;min-height:50px}#still-concept .st-nav button[aria-current=page]{color:var(--st-accent);background:var(--st-soft)}#still-concept .st-nav svg{width:19px;height:19px}
    #still-concept .st-back{border:0;background:none;color:var(--st-muted);display:flex;align-items:center;gap:8px;font-size:12px;padding:6px 0;min-height:44px}#still-concept .st-back svg{width:16px;height:16px}#still-concept .st-pill{display:inline-flex;border:1px solid var(--st-line);border-radius:30px;padding:7px 11px;font-size:11px;color:var(--st-muted);margin-top:15px}
    #still-concept .st-orbit{height:60px;position:relative;display:grid;place-items:center;margin:15px 0}#still-concept .st-orbit::before,#still-concept .st-orbit::after{content:"";position:absolute;border:1px solid var(--st-line);width:58px;height:58px;border-radius:50%}#still-concept .st-orbit::after{width:38px;height:38px}#still-concept .st-orbit span{width:14px;height:14px;background:var(--st-accent);border-radius:50%}
    #still-concept .st-reminder{font-family:Georgia,serif;font-size:27px;line-height:1.4;letter-spacing:-.45px;padding:16px 0 22px}#still-concept .st-rule{border-top:1px solid var(--st-line);padding:18px 0 27px}#still-concept .st-rule p{font-size:13px;line-height:1.6;margin-top:8px}#still-concept .st-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--st-muted);margin-bottom:12px}#still-concept .st-note{width:100%;min-height:115px;background:var(--st-panel);color:var(--st-text);border:1px solid var(--st-line);border-radius:14px;padding:14px;font-size:16px;resize:vertical;line-height:1.5}#still-concept .st-note::placeholder{color:var(--st-muted)}
    #still-concept .st-recorder{margin:23px 0;background:var(--st-panel);border:1px solid var(--st-line);border-radius:22px;text-align:center;padding:23px 16px}#still-concept .st-time{font-size:34px;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:14px 0}#still-concept .st-wave{height:35px;display:flex;align-items:center;justify-content:center;gap:4px;margin:16px 0 22px}#still-concept .st-wave span{width:3px;height:var(--h);border-radius:4px;background:var(--st-accent);opacity:.75}#still-concept .st-rec-button{border:1px solid var(--st-line);background:var(--st-bg);border-radius:30px;padding:13px 20px;min-height:46px;display:inline-flex;align-items:center;gap:9px;font-size:13px}#still-concept .st-rec-button svg{width:16px;height:16px}#still-concept .st-small{font-size:11px;color:var(--st-muted);line-height:1.5}
    #still-concept .st-entry{width:100%;border:0;border-top:1px solid var(--st-line);background:none;text-align:left;padding:19px 0;display:grid;grid-template-columns:39px 1fr 18px;gap:10px;align-items:start}#still-concept .st-entry time{font-size:11px;color:var(--st-muted);padding-top:4px}#still-concept .st-entry strong{display:block;font-size:14px;font-weight:500;margin-bottom:6px}#still-concept .st-entry p{font-size:12px;color:var(--st-muted);line-height:1.6}#still-concept .st-entry svg{width:16px;height:16px;color:var(--st-muted);margin-top:3px}#still-concept .st-card{padding:18px;border:1px solid var(--st-line);background:var(--st-panel);border-radius:18px;margin:22px 0}#still-concept .st-card p{font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}#still-concept .st-toast{font-size:12px;color:var(--st-accent);margin:10px 0;min-height:17px}#still-concept .st-stack{display:flex;gap:10px;margin-top:16px}#still-concept .st-secondary{border:1px solid var(--st-line);border-radius:14px;background:var(--st-panel);padding:13px;min-height:46px;font-size:13px}
    #still-concept .st-settings{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;background:none;border:0;color:var(--st-muted);font-size:12px;padding:8px}#still-concept .st-settings svg{width:16px;height:16px}
    #still-concept .st-formats{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}#still-concept .st-check{display:flex;align-items:center;gap:8px;font-size:13px;min-height:44px;border:1px solid var(--st-line);border-radius:12px;padding:10px;background:var(--st-panel)}#still-concept input[type=checkbox]{accent-color:var(--st-accent);width:17px;height:17px}
    #still-concept .st-upload{border:1px solid var(--st-line);background:var(--st-panel);border-radius:16px;padding:15px;margin:14px 0}#still-concept .st-upload input{display:block;font-size:12px;width:100%;min-height:44px;padding:8px 0;color:var(--st-muted)}#still-concept .st-upload input::file-selector-button{background:var(--st-bg);color:var(--st-text);border:1px solid var(--st-line);border-radius:8px;padding:8px;cursor:pointer}#still-concept .st-upload p{font-size:12px;color:var(--st-muted);overflow-wrap:anywhere}
    #still-concept .st-media{margin:0 0 22px;padding:15px;background:var(--st-panel);border:1px solid var(--st-line);border-radius:16px}#still-concept .st-media audio{width:100%;display:block;height:42px}#still-concept .st-image{width:100%;max-height:240px;object-fit:contain;display:block;border-radius:12px;background:var(--st-panel)}#still-concept .st-picker{width:100%;background:var(--st-panel);color:var(--st-text);border:1px solid var(--st-line);border-radius:12px;font:inherit;font-size:16px;padding:13px;min-height:48px;margin-bottom:24px}
    #still-concept .st-theme-choice{border:1px solid var(--st-line);border-radius:15px;background:var(--st-panel);padding:14px;display:flex;align-items:center;gap:10px;min-height:54px;font-size:13px}#still-concept .st-theme-choice[aria-pressed=true]{border-color:var(--st-accent);background:var(--st-soft)}#still-concept .st-swatch{width:16px;height:16px;background:var(--swatch);border-radius:50%;flex-shrink:0}
    #still-concept[data-motion=on] .st-emotion,#still-concept[data-motion=on] .st-primary,#still-concept[data-motion=on] .st-nav button{transition:transform 180ms ease,background-color 180ms ease,border-color 180ms ease}#still-concept[data-motion=on] .st-emotion svg,#still-concept[data-motion=on] .st-primary svg{transition:transform 200ms ease}#still-concept[data-motion=on] .st-emotion:hover svg{transform:translateY(-2px) rotate(-5deg)}#still-concept[data-motion=on] .st-primary:hover svg{transform:translateX(2px)}#still-concept[data-motion=on] button:active{transform:scale(.98)}
    @media(prefers-reduced-motion:reduce){#still-concept[data-motion=on] *,#still-concept[data-motion=on] *::before,#still-concept[data-motion=on] *::after{transition:none!important;animation:none!important;transform:none!important}}
    @media(max-width:370px){#still-concept .st-top{padding:20px 18px 12px}#still-concept .st-content{padding:8px 18px 24px}#still-concept h2{font-size:33px}#still-concept .st-emotion{padding:12px}#still-concept .st-reminder{font-size:25px}}
  </style>
  <div class="st-phone">
    <header class="st-top"><span class="st-brand">still.</span><span class="st-demo">Concept</span><button type="button" class="st-settings" data-go="appearance" aria-label="Appearance settings"><i data-lucide="sliders-horizontal" aria-hidden="true"></i>Theme</button></header>
    <main class="st-content" id="st-screen"></main>
    <nav class="st-nav" aria-label="Main navigation">
      <button type="button" data-nav="now" aria-current="page"><i data-lucide="circle-dot" aria-hidden="true"></i>Now</button>
      <button type="button" data-nav="review"><i data-lucide="rows-3" aria-hidden="true"></i>Review</button>
      <button type="button" data-nav="toolkit"><i data-lucide="bookmark" aria-hidden="true"></i>Toolkit</button>
    </nav>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('still-concept');
    const screen=root.querySelector('#st-screen');
    const emotions=[
      {name:'FOMO',sub:'The urge to chase',icon:'move-up-right',reminder:'A moving price is not an instruction. I can let this move go.',action:'Return to my entry checklist.'},
      {name:'Fear',sub:'Bracing for a loss',icon:'shield',reminder:'Uncertainty can be here. My next decision can still follow my plan.',action:'Read the risk I agreed to before entering.'},
      {name:'Frustration',sub:'Pushing against it',icon:'wind',reminder:'This feeling does not need an immediate trade.',action:'Step back from the chart for a moment.'},
      {name:'Revenge urge',sub:'Wanting it back',icon:'rotate-ccw',reminder:'The next trade does not owe me the last loss.',action:'Pause and check my session limits.'},
      {name:'Overconfidence',sub:'Feeling invincible',icon:'sun',reminder:'A winning streak does not change the rules I chose.',action:'Check my size and setup criteria.'},
      {name:'Hesitation',sub:'Second-guessing',icon:'pause',reminder:'I can notice doubt and check the facts of my setup.',action:'Read my checklist one item at a time.'},
      {name:'Unsure',sub:'No label needed',icon:'circle-help',reminder:'I do not have to name this feeling to notice it.',action:'Describe a thought, sensation, or urge.'}
    ];
    const entries=[{name:'FOMO',time:'10:42',text:'I missed the first move. Now every candle feels like the last chance to get in.',kind:'Sample entry',duration:24,reflection:''},{name:'Hesitation',time:'10:18',text:'The setup was there, but I kept looking for more confirmation.',kind:'Sample entry',duration:18,reflection:''}];
    let view='now',selected=0,entryIndex=0,recording=false,seconds=0,timer=null,recorded=false,draft='',returnTo='now';
    const design={appearance:'Auto',accent:'Sage',corners:16,motion:true};
    emotions.forEach(e=>{e.formats={text:true,audio:false,image:false};e.audio='';e.image='';e.audioName='';e.imageName='';});
    let editDraft=null;
    const limits={note:4000,reminder:1000,action:300,entries:100,mediaBytes:24*1024*1024,imagePixels:4000000,imageSide:4096};
    const mediaUrls=new Map(),pendingMedia=new Map(),eventScope=new AbortController();
    let disposed=false,tweak=null;
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
    const back=(dest,label='Back')=>`<button type="button" class="st-back" data-go="${dest}">${icon('arrow-left')}${label}</button>`;
    function stopTimer(){if(timer!==null)clearInterval(timer);timer=null;recording=false;}
    function releasePlayers(){screen.querySelectorAll('audio').forEach(a=>{a.pause();a.removeAttribute('src');a.load();});}
    function pauseActivities(){if(view==='capture'&&recording){draft=screen.querySelector('#st-note')?.value||'';stopTimer();recorded=seconds>0;render();feedback('Demo recording stopped while the preview was hidden.');}screen.querySelectorAll('audio').forEach(a=>a.pause());}
    function cancelPending(){pendingMedia.forEach(task=>task.controller.abort());pendingMedia.clear();}
    function releaseUnusedMedia(){const retained=new Set();for(const item of [...emotions,editDraft])if(item)for(const kind of ['audio','image'])if(item[kind])retained.add(item[kind]);pendingMedia.forEach(task=>{if(task.url)retained.add(task.url);});for(const url of mediaUrls.keys())if(!retained.has(url)){URL.revokeObjectURL(url);mediaUrls.delete(url);}}
    function navigate(next){if(disposed)return;if(view==='capture'){draft=screen.querySelector('#st-note')?.value||'';stopTimer();}if(view==='edit'&&next!=='edit'){cancelPending();editDraft=null;releaseUnusedMedia();}view=next;render();if(design.motion&&!matchMedia('(prefers-reduced-motion: reduce)').matches)screen.animate([{transform:'translateY(5px)'},{transform:'translateY(0)'}],{duration:190,easing:'ease-out'});}
    function render(){
      if(disposed)return;
      releasePlayers();
      root.querySelectorAll('[data-nav]').forEach(b=>{if(b.dataset.nav===(['guide','capture','edit'].includes(view)?'now':view==='entry'?'review':view))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
      const e=emotions[selected];
      if(view==='now')screen.innerHTML=`<div class="st-meta"><span class="st-dot"></span>Session in progress</div><h2>A little space.<br>A <em>clearer mind.</em></h2><p class="st-sub">Notice what is here. Choose your next step.</p><div class="st-section"><span>What are you noticing?</span><span>Tap to check in</span></div><div class="st-grid">${emotions.slice(0,6).map((x,i)=>`<button type="button" class="st-emotion" data-emotion="${i}">${icon(x.icon)}<span>${x.name}</span><small>${x.sub}</small></button>`).join('')}</div><button type="button" class="st-quiet" data-emotion="6">I’m not sure yet ${icon('arrow-right')}</button><button type="button" class="st-primary" data-action="quick">${icon('mic')}Just capture a thought</button>`;
      if(view==='guide')screen.innerHTML=`${back(returnTo)}<span class="st-pill">${esc(e.name)} · Injecting logic</span><div class="st-orbit" aria-hidden="true"><span></span></div><div class="st-meta">Come back to your plan</div>${e.formats.text?`<p class="st-reminder">${esc(e.reminder)}</p>`:''}${e.formats.audio&&e.audio?`<div class="st-media"><span class="st-label">Your voice · Your logic</span><audio controls preload="metadata" src="${esc(e.audio)}" aria-label="Personal injecting logic audio"></audio></div>`:''}${e.formats.image&&e.image?`<div class="st-media"><img class="st-image" src="${esc(e.image)}" alt="Personal visual reminder for ${esc(e.name)}"></div>`:''}<div class="st-rule"><span class="st-label">One small next step</span><p>${esc(e.action)}</p></div><button type="button" class="st-primary" data-action="capture">${icon('mic')}Capture what I’m feeling</button><button type="button" class="st-quiet" data-edit="${selected}">${icon('sliders-horizontal')}Personalize text, audio & image</button><button type="button" class="st-quiet" data-go="now">I’m ready to return ${icon('arrow-right')}</button>`;
      if(view==='capture')screen.innerHTML=`${back('guide')}<span class="st-pill">${esc(e.name)}</span><h2>Give it <em>words.</em></h2><p class="st-sub">What is going through your mind right now?</p><div class="st-recorder"><div class="st-small">Demo recording · microphone off</div><div class="st-time" id="st-clock">${formatTime(seconds)}</div><div class="st-wave" aria-hidden="true">${[8,13,23,16,28,34,18,12,25,32,19,9,14,27,35,19,25,14,8,19,27,12,7].map(h=>`<span style="--h:${h}px"></span>`).join('')}</div><button type="button" class="st-rec-button" id="st-record" data-action="record">${icon(recording?'square':'mic')}${recording?'Stop demo':recorded?'Record again':'Try recording'}</button></div><label class="st-label" for="st-note">Or write it down</label><textarea class="st-note" id="st-note" placeholder="I notice that…">${esc(draft)}</textarea><div class="st-toast" id="st-feedback" role="status"></div><button type="button" class="st-primary" data-action="save">Save moment ${icon('arrow-right')}</button>`;
      if(view==='review')screen.innerHTML=`<div class="st-meta">Session journal</div><h2>See it with<br><em>fresh eyes.</em></h2><p class="st-sub">A moment captured. A little more understood.</p><div class="st-section"><span>Today’s session</span><span>${entries.length} moments · demo data</span></div>${entries.map((x,i)=>`<button type="button" class="st-entry" data-entry="${i}"><time>${esc(x.time)}</time><div><strong>${esc(x.name)}</strong><p>${esc(x.text||'A voice moment captured in the prototype.')}</p><div class="st-small" style="margin-top:8px">${esc(x.kind)}${x.duration?' · '+formatTime(x.duration):''}</div></div>${icon('chevron-right')}</button>`).join('')}`;
      if(view==='entry'){const x=entries[entryIndex];screen.innerHTML=`${back('review','Session review')}<span class="st-pill">${esc(x.time)} · ${esc(x.kind)}</span><h2>${esc(x.name)}<br><em>In that moment.</em></h2><div class="st-card"><span class="st-label">${x.kind==='Sample entry'?'Sample transcript':'Captured note'}</span><p>${esc(x.text||'Demo recording saved without audio.')}</p><div class="st-small" style="margin-top:15px">Audio playback will be available in the app.</div></div><label class="st-label" for="st-reflection">Looking back, what do you notice?</label><textarea class="st-note" id="st-reflection" placeholder="What was I expecting? What helped?">${esc(x.reflection)}</textarea><div class="st-toast" id="st-feedback" role="status"></div><button type="button" class="st-primary" data-action="reflection">Save reflection ${icon('check')}</button>`;}
      if(view==='toolkit')screen.innerHTML=`<div class="st-meta">Your personal toolkit</div><h2>Your words.<br>Your <em>way back.</em></h2><p class="st-sub">Shape each reminder while your mind is clear.</p><div class="st-section"><span>Personal reminders</span><span>${emotions.length} cards</span></div>${emotions.map((x,i)=>`<button type="button" class="st-entry" data-edit="${i}" style="grid-template-columns:24px 1fr 18px">${icon(x.icon)}<div><strong>${esc(x.name)}</strong><p>${esc(x.reminder)}</p></div>${icon('chevron-right')}</button>`).join('')}`;
      if(view==='edit'){if(!editDraft)editDraft={...e,formats:{...e.formats}};const d=editDraft;screen.innerHTML=`${back('toolkit','Your toolkit')}<span class="st-pill">${esc(e.name)} · Injecting logic</span><h2>Make it<br><em>your own.</em></h2><p class="st-sub">Text, your voice, an image. Whatever connects.</p><div class="st-formats">${['text','audio','image'].map(f=>`<label class="st-check"><input type="checkbox" data-format="${f}" ${d.formats[f]?'checked':''}>${f[0].toUpperCase()+f.slice(1)}</label>`).join('')}</div><div ${d.formats.text?'':'hidden'}><label class="st-label" for="st-reminder">Your injecting logic</label><textarea class="st-note" id="st-reminder">${esc(d.reminder)}</textarea></div>${d.formats.audio?`<div class="st-upload"><label class="st-label" for="st-audio-file">Your personal audio</label><input type="file" id="st-audio-file" accept="audio/*" data-media="audio"><p>${esc(d.audioName||'Choose an audio file · up to 15 MB')}</p></div>`:''}${d.formats.image?`<div class="st-upload"><label class="st-label" for="st-image-file">Your visual reminder</label><input type="file" id="st-image-file" accept="image/png,image/jpeg,image/webp" data-media="image"><p>${esc(d.imageName||'Choose a photo or image · up to 8 MB')}</p>${d.image?`<img class="st-image" style="margin-top:12px" src="${esc(d.image)}" alt="Selected visual reminder">`:''}</div>`:''}<label class="st-label" for="st-action" style="margin-top:22px">Your next step</label><textarea class="st-note" id="st-action" style="min-height:85px">${esc(d.action)}</textarea><div class="st-small" style="margin-top:17px">Preview only. Selected media stays in this preview and resets when it reloads.</div><div class="st-toast" id="st-feedback" role="status"></div><button type="button" class="st-primary" data-action="reminder">Save & preview ${icon('arrow-right')}</button>`;}
      if(view==='appearance')screen.innerHTML=`${back('now')}<div class="st-meta">Make space for yourself</div><h2>A different<br><em>kind of quiet.</em></h2><p class="st-sub">A look that feels right for your session.</p><label class="st-label" for="st-appearance" style="margin-top:28px">Appearance</label><select class="st-picker" id="st-appearance">${['Auto','Dark','Light'].map(x=>`<option ${design.appearance===x?'selected':''}>${x}</option>`).join('')}</select><span class="st-label">Palette</span><div class="st-grid">${[['Sage','#b6cb91'],['Sand','#d4b68b'],['Ocean','#9abbdc'],['Lavender','#c0afdf']].map(([x,color])=>`<button type="button" class="st-theme-choice" data-theme="${x}" aria-pressed="${design.accent===x}"><span class="st-swatch" style="--swatch:${color}"></span>${x}</button>`).join('')}</div><div class="st-rule" style="margin-top:28px"><label class="st-check" style="border:0;background:none;padding:0"><input type="checkbox" id="st-motion" ${design.motion?'checked':''}>Subtle motion</label><p class="st-small">Gentle tap feedback and short transitions. Your device’s reduced-motion setting takes priority.</p></div><button type="button" class="st-primary" data-go="now">Back to my session ${icon('arrow-right')}</button>`;
      const fieldLimits={'st-note':limits.note,'st-reflection':limits.note,'st-reminder':limits.reminder,'st-action':limits.action};
      Object.entries(fieldLimits).forEach(([id,max])=>{const el=screen.querySelector('#'+id);if(el)el.maxLength=max;});
      screen.querySelectorAll('.st-entry p').forEach(el=>{if(el.textContent.length>160)el.textContent=el.textContent.slice(0,160)+'…';});
      screen.querySelectorAll('.st-reminder,.st-entry p,.st-rule p').forEach(el=>el.style.overflowWrap='anywhere');
      applyDesign();if(globalThis.lucide)lucide.createIcons();
    }
    function formatTime(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
    function feedback(text){const target=screen.querySelector('#st-feedback');if(target)target.textContent=text;}
    root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||!root.contains(b))return;
      if(b.dataset.nav){navigate(b.dataset.nav);return;}
      if(b.dataset.go){navigate(b.dataset.go);return;}
      if(b.dataset.emotion!==undefined){selected=Number(b.dataset.emotion);returnTo='now';navigate('guide');return;}
      if(b.dataset.entry!==undefined){entryIndex=Number(b.dataset.entry);navigate('entry');return;}
      if(b.dataset.edit!==undefined){cancelPending();selected=Number(b.dataset.edit);editDraft=null;releaseUnusedMedia();navigate('edit');return;}
      if(b.dataset.theme){design.accent=b.dataset.theme;render();return;}
      const action=b.dataset.action;
      if(action==='capture'||action==='quick'){if(action==='quick')selected=6;seconds=0;recorded=false;draft='';navigate('capture');}
      if(action==='record'){draft=screen.querySelector('#st-note').value;if(recording){stopTimer();recorded=true;render();feedback('Demo complete. No microphone audio was captured.');}else{seconds=0;recorded=false;recording=true;render();timer=setInterval(()=>{seconds++;const clock=screen.querySelector('#st-clock');if(clock)clock.textContent=formatTime(seconds);if(seconds>=120){stopTimer();recorded=true;draft=screen.querySelector('#st-note')?.value||'';render();}},1000);}}
      if(action==='save'){draft=screen.querySelector('#st-note').value.trim();if(draft.length>limits.note){feedback('Keep this note within 4,000 characters.');return;}if(entries.length>=limits.entries){feedback('This preview is full (100 moments). Your existing moments are kept.');return;}if(recording){feedback('Stop the demo recording before saving.');return;}if(!draft&&!recorded){feedback('Write a thought or try the demo recording first.');return;}entries.unshift({name:emotions[selected].name,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false}),text:draft,kind:'Prototype entry',duration:recorded?seconds:0,reflection:''});navigate('review');}
      if(action==='reflection'){const value=screen.querySelector('#st-reflection').value;if(value.length>limits.note){feedback('Keep this reflection within 4,000 characters.');return;}entries[entryIndex].reflection=value;feedback('Reflection saved for this preview.');}
      if(action==='reminder'){captureEdit();const d=editDraft;if(pendingMedia.size){feedback('Wait for the selected media to finish checking.');return;}if(d.reminder.length>limits.reminder||d.action.length>limits.action){feedback('Use up to 1,000 characters for logic and 300 for the next step.');return;}if(!Object.values(d.formats).some(Boolean)){feedback('Choose at least one format.');return;}if(d.formats.text&&!d.reminder.trim()){feedback('Add your injecting logic text.');return;}if(d.formats.audio&&!d.audio){feedback('Choose your audio file.');return;}if(d.formats.image&&!d.image){feedback('Choose your image.');return;}for(const kind of ['audio','image'])if(!d.formats[kind]){d[kind]='';d[kind+'Name']='';}Object.assign(emotions[selected],d,{formats:{...d.formats}});returnTo='toolkit';editDraft=null;releaseUnusedMedia();navigate('guide');}
    },{signal:eventScope.signal});
    function captureEdit(){if(!editDraft)return;editDraft.reminder=screen.querySelector('#st-reminder')?.value??editDraft.reminder;editDraft.action=screen.querySelector('#st-action')?.value??editDraft.action;}
    root.addEventListener('change',event=>{const el=event.target;if(el.id==='st-appearance'){design.appearance=el.value;applyDesign();}if(el.id==='st-motion'){design.motion=el.checked;applyDesign();}if(el.dataset.format){captureEdit();const kind=el.dataset.format;editDraft.formats[kind]=el.checked;if(!el.checked&&kind!=='text'){pendingMedia.get(kind)?.controller.abort();pendingMedia.delete(kind);editDraft[kind]='';editDraft[kind+'Name']='';releaseUnusedMedia();}render();}if(el.dataset.media){const file=el.files?.[0];if(file)void attachMedia(file,el.dataset.media);}}, {signal:eventScope.signal});
    function imageDimensions(bytes,type){
      const data=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),at=(offset,count)=>String.fromCharCode(...bytes.slice(offset,offset+count));
      if(type==='image/png'&&bytes.length>=24&&bytes.slice(0,8).every((x,i)=>x===[137,80,78,71,13,10,26,10][i]))return [data.getUint32(16),data.getUint32(20)];
      if(type==='image/jpeg'&&bytes[0]===255&&bytes[1]===216){let i=2;while(i+9<bytes.length){if(bytes[i++]!==255)break;while(bytes[i]===255)i++;const marker=bytes[i++];if(marker===217||marker===218)break;const length=(bytes[i]<<8)|bytes[i+1];if(length<2)break;if([192,193,194,195,197,198,199,201,202,203,205,206,207].includes(marker))return [(bytes[i+5]<<8)|bytes[i+6],(bytes[i+3]<<8)|bytes[i+4]];i+=length;}}
      if(type==='image/webp'&&bytes.length>=30&&at(0,4)==='RIFF'&&at(8,4)==='WEBP'){const chunk=at(12,4);if(chunk==='VP8X')return [1+bytes[24]+(bytes[25]<<8)+(bytes[26]<<16),1+bytes[27]+(bytes[28]<<8)+(bytes[29]<<16)];if(chunk==='VP8L'&&bytes[20]===47)return [1+bytes[21]+((bytes[22]&63)<<8),1+(bytes[22]>>6)+(bytes[23]<<2)+((bytes[24]&15)<<10)];if(chunk==='VP8 '&&bytes[23]===157&&bytes[24]===1&&bytes[25]===42)return [data.getUint16(26,true)&16383,data.getUint16(28,true)&16383];}
      throw new Error('Choose a valid PNG, JPEG, or WebP image.');
    }
    function validAudioHeader(bytes,type){const at=(offset,count)=>String.fromCharCode(...bytes.slice(offset,offset+count));return (['audio/wav','audio/x-wav','audio/wave'].includes(type)&&at(0,4)==='RIFF'&&at(8,4)==='WAVE')||(type==='audio/mpeg'&&(at(0,3)==='ID3'||(bytes[0]===255&&(bytes[1]&224)===224)))||(['audio/mp4','audio/x-m4a'].includes(type)&&at(4,4)==='ftyp')||(type==='audio/ogg'&&at(0,4)==='OggS')||(type==='audio/webm'&&bytes.slice(0,4).every((v,i)=>v===[26,69,223,163][i])&&bytes.length>=4);}
    function checkDecodedMedia(url,kind,signal){return new Promise((resolve,reject)=>{
      const element=kind==='image'?new Image():document.createElement('audio');let ended=false;
      const finish=error=>{if(ended)return;ended=true;clearTimeout(timeout);signal.removeEventListener('abort',abort);element.onload=element.onerror=element.onloadedmetadata=null;if(kind==='audio'){element.pause();element.removeAttribute('src');element.load();}else element.removeAttribute('src');error?reject(error):resolve();};
      const abort=()=>finish(new DOMException('Canceled','AbortError'));
      const timeout=setTimeout(()=>finish(new Error('This media could not be checked. Choose another file.')),8000);
      signal.addEventListener('abort',abort,{once:true});element.onerror=()=>finish(new Error('This media could not be read. Choose another file.'));
      if(kind==='image')element.onload=()=>finish(element.naturalWidth>limits.imageSide||element.naturalHeight>limits.imageSide||element.naturalWidth*element.naturalHeight>limits.imagePixels?new Error('Choose an image under 4 megapixels and 4,096 pixels per side.'):null);
      else{element.preload='metadata';element.onloadedmetadata=()=>finish(!Number.isFinite(element.duration)||element.duration<=0||element.duration>300?new Error('Choose an audio reminder up to 5 minutes long.'):null);}
      if(signal.aborted){abort();return;}element.src=url;
    });}
    async function attachMedia(file,kind){
      captureEdit();const currentDraft=editDraft;if(!currentDraft||!['audio','image'].includes(kind))return;
      pendingMedia.get(kind)?.controller.abort();
      const task={controller:new AbortController(),url:''};pendingMedia.set(kind,task);
      const stillCurrent=()=>!disposed&&root.isConnected&&view==='edit'&&editDraft===currentDraft&&pendingMedia.get(kind)===task&&currentDraft.formats[kind]&&!task.controller.signal.aborted;
      try{
        if(!file.size||file.size>(kind==='audio'?15:8)*1024*1024)throw new Error('Choose a nonempty '+kind+' file within the size limit.');
        const bytes=new Uint8Array(await file.slice(0,262144).arrayBuffer());if(!stillCurrent())return;
        if(kind==='image'){const [width,height]=imageDimensions(bytes,file.type);if(!width||!height||width>limits.imageSide||height>limits.imageSide||width*height>limits.imagePixels)throw new Error('Choose an image under 4 megapixels and 4,096 pixels per side.');}
        else if(!validAudioHeader(bytes,file.type))throw new Error('Choose a supported, valid audio file.');
        const used=[...mediaUrls.values()].reduce((sum,size)=>sum+size,0);if(used+file.size>limits.mediaBytes)throw new Error('This preview has reached its 24 MB media limit. Remove a saved attachment first.');
        task.url=URL.createObjectURL(file);mediaUrls.set(task.url,file.size);
        await checkDecodedMedia(task.url,kind,task.controller.signal);if(!stillCurrent())return;
        captureEdit();currentDraft[kind]=task.url;currentDraft[kind+'Name']=file.name.slice(0,180);pendingMedia.delete(kind);render();feedback('Added to this preview.');
      }catch(error){if(stillCurrent()&&error.name!=='AbortError')feedback(error.message);}
      finally{if(pendingMedia.get(kind)===task)pendingMedia.delete(kind);releaseUnusedMedia();}
    }
    function dispose(){if(disposed)return;disposed=true;stopTimer();cancelPending();releasePlayers();eventScope.abort();removalObserver.disconnect();if(tweak)tweak.dispose();for(const url of mediaUrls.keys())URL.revokeObjectURL(url);mediaUrls.clear();entries.length=0;emotions.length=0;editDraft=null;draft='';}
    const removalObserver=new MutationObserver(()=>{if(!root.isConnected)dispose();});
    removalObserver.observe(document.documentElement,{childList:true,subtree:true});
    window.addEventListener('pagehide',event=>{if(!event.persisted)dispose();else pauseActivities();},{signal:eventScope.signal});
    document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseActivities();},{signal:eventScope.signal});
    function applyDesign(){root.style.colorScheme=design.appearance==='Auto'?'light dark':design.appearance.toLowerCase();root.dataset.motion=design.motion?'on':'off';const palettes={Sage:{bg:['#f6f4ee','#161a18'],panel:['#eeede6','#202622'],text:['#242e27','#eeefe7'],muted:['#616b60','#a6b1a5'],line:['#d9ddd3','#343d35'],accent:['#344d32','#d2e4af'],on:['#f8f8f0','#253222'],soft:['#e2e8d8','#2b372a']},Sand:{bg:['#f8f3eb','#201c18'],panel:['#eee6da','#2a241e'],text:['#382d22','#f2e9dc'],muted:['#71604e','#baac9b'],line:['#d9ccbb','#44382b'],accent:['#67502c','#e6cdaa'],on:['#fff9f0','#392c1a'],soft:['#e9ddca','#403321']},Ocean:{bg:['#f1f5f8','#151c24'],panel:['#e6edf3','#202b36'],text:['#22374b','#e9f0f6'],muted:['#546b7d','#a8bac9'],line:['#cbd8e2','#354858'],accent:['#305575','#b1d4ef'],on:['#f4faff','#1d3549'],soft:['#dce8f2','#293e50']},Lavender:{bg:['#f7f3f9','#1e1a24'],panel:['#eee6f2','#2b2433'],text:['#382b43','#f1eaf6'],muted:['#705d7c','#bdacc8'],line:['#ddd0e5','#47394f'],accent:['#64457a','#dcc3ed'],on:['#fdf7ff','#3c284a'],soft:['#e9ddf0','#3d2e48']}};Object.entries(palettes[design.accent]).forEach(([key,pair])=>root.style.setProperty('--st-'+(key==='on'?'on-accent':key),`light-dark(${pair[0]},${pair[1]})`));screen.querySelectorAll('.st-emotion,.st-primary,.st-note').forEach(el=>el.style.borderRadius=design.corners+'px');}
    render();
    if(globalThis.Tweak){tweak=new Tweak({container:root,onChange:()=>{applyDesign();if(view==='appearance')render();}});tweak.addSelect(design,'appearance',{label:'Appearance',options:['Auto','Dark','Light']});tweak.addSelect(design,'accent',{label:'Accent',options:['Sage','Sand','Ocean','Lavender']});tweak.addToggle(design,'motion',{label:'Subtle motion'});tweak.addSlider(design,'corners',{label:'Corner softness',min:4,max:24,unit:'px'});}
  })();
  </script>
